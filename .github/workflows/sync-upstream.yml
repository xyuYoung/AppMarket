name: Sync Upstream

on:
  schedule:
    - cron: "0 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/YXBwbWFya2V0/AppMarket.git
          git fetch upstream main

      - name: Check for updates
        id: check
        run: |
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)

          echo "Current:  $LOCAL"
          echo "Upstream: $UPSTREAM"

          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync source
        if: steps.check.outputs.changed == 'true'
        run: |
          git fetch upstream main

          # 保存自己的 GitHub Actions
          mkdir -p /tmp/my-workflows
          cp -a .github/workflows /tmp/my-workflows/

          # 同步上游源码
          git reset --hard upstream/main

          # 恢复自己的 GitHub Actions
          rm -rf .github/workflows
          mkdir -p .github
          cp -a /tmp/my-workflows/workflows .github/

          # 提交同步结果
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Sync upstream"

          git push origin main
